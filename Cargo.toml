[workspace]
resolver = "3"
members = [
    "crates/schooner-engine",
    "crates/game",
    "crates/bench-ecs",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/MuirDun/schooner"

[workspace.dependencies]
wgpu = "29"
winit = "0.30"
glam = "0.32"
bitflags = "2.13.0"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false }
egui-wgpu = { version = "0.34", default-features = false }
puffin = "0.20"
smallvec = "1"
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rapier3d = { version = "0.33.0", default-features = false, features = ["dim3", "f32", "std"] }

schooner-engine = { path = "crates/schooner-engine" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
